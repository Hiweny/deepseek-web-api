name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # secrets 不能直接出现在 step 的 if 里（会报 Unrecognized named-value），先落到 job 级 env
    env:
      E2E_ENABLED: ${{ secrets.DS_TEST_PHONE != '' }}
    defaults:
      run:
        working-directory: desktop/DSWebApi.Desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # ---------- 1) 核心引擎自检（解析/转义/正文不吞内容/bridge 资源）----------
      - name: Self test (engine + bridge resource)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "bin\Release\net8.0-windows\win-x64\DeepSeekWebAPI.exe").Path
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $slog = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI\selftest.log"
          Remove-Item $slog -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait
          Write-Host "selftest exit = $($p.ExitCode)"
          if (Test-Path $slog) { Get-Content $slog } else { Write-Host "!! 未生成 selftest.log" }
          if ($p.ExitCode -ne 0) { throw "引擎自检失败（exit=$($p.ExitCode)）" }
          $txt = if (Test-Path $slog) { Get-Content $slog -Raw } else { "" }
          if ($txt -notmatch 'PASS\s+S bridge\.js') { throw "自检里 bridge.js 内嵌资源用例未通过（曾导致 API 全部 NO_BRIDGE）" }
          # 工具调用参数归一化：声明为 string 的参数被写成对象时，必须转成字符串
          if ($txt -notmatch 'PASS\s+T 声明为 string') { throw "工具参数按声明类型归一化用例未通过（string 参数不得以对象形式返回给客户端）" }
          if ($txt -notmatch 'PASS\s+U 声明为 object') { throw "工具参数归一化的反向保护用例未通过（object 参数必须保持对象）" }

      # ---------- 2) 单文件发布 ----------
      - name: Publish single-file exe
        run: dotnet publish -c Release -o publish

      - name: Inspect publish output
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name,Length | Format-Table -AutoSize
          $exe = "publish\DeepSeekWebAPI.exe"
          if (-not (Test-Path $exe)) { throw "未生成单文件 exe" }
          Write-Host ("exe size = {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

      # ---------- 3) 真机冒烟：启动 / 窗口 / HTTP 探活 / bridge 真正载入 ----------
      - name: Smoke test (launch + HTTP probe + bridge loaded)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\DeepSeekWebAPI.exe"
          $log = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI\app.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          Write-Host "启动: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Write-Host "pid = $($p.Id)"
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "!! 进程提前退出，exit=$($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            throw "程序启动后立即退出"
          }
          $healthOk = $false; $health = ""
          for ($i = 0; $i -lt 12; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8787/health" -TimeoutSec 5 -UseBasicParsing
              $health = $r.Content
              Write-Host "GET /health -> $($r.StatusCode) $health"
              if ($health -like '*"status":"ok"*') { $healthOk = $true; break }
            } catch { Write-Host "等待服务就绪 ($i): $($_.Exception.Message)" }
            Start-Sleep -Seconds 3
          }
          if (Test-Path $log) { Write-Host "----- app.log -----"; Get-Content $log; Write-Host "----- /app.log -----" }
          $p.Refresh()
          Write-Host "MainWindowHandle = $($p.MainWindowHandle)"
          if (-not $healthOk) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "HTTP /health 未就绪" }

          # 关键回归：bridge.js 必须真的载入（bytes 远大于 0）
          if ($health -notlike '*"bridge_loaded":true*') {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "bridge.js 未载入（health 里 bridge_loaded 不是 true）：$health"
          }
          if ($health -match '"bridge_bytes":(\d+)') {
            $bytes = [int]$Matches[1]
            Write-Host "bridge_bytes = $bytes"
            if ($bytes -lt 5000) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "bridge.js 内容异常（$bytes 字节）" }
          }

          try {
            $m = Invoke-WebRequest -Uri "http://127.0.0.1:8787/v1/models" -Headers @{ Authorization = "Bearer sk-deepseek" } -TimeoutSec 5 -UseBasicParsing
            Write-Host "GET /v1/models -> $($m.StatusCode) $($m.Content)"
          } catch { Write-Host "!! /v1/models 失败: $($_.Exception.Message)" }

          try {
            $bad = Invoke-WebRequest -Uri "http://127.0.0.1:8787/v1/models" -TimeoutSec 5 -UseBasicParsing
            Write-Host "!! 未带 Key 竟然成功: $($bad.StatusCode)"
          } catch {
            Write-Host "未鉴权请求被拒（预期 401）: $($_.Exception.Response.StatusCode.value__)"
          }

          # 截一张界面图：用 PrintWindow 按窗口真实尺寸渲染（CI 虚拟屏只有 1024x768，
          # 直接截屏会把 1440x900 的窗口裁掉一半），便于远程确认 UI 观感与自适应。
          try {
            Add-Type -AssemblyName System.Drawing
            Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdcBlt, uint nFlags); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr after, int x, int y, int cx, int cy, uint flags); public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }'
            New-Item -ItemType Directory -Force ui-shot | Out-Null
            Start-Sleep -Seconds 4
            $p.Refresh()
            $h = (Get-Process -Id $p.Id).MainWindowHandle
            Write-Host "窗口句柄 = $h"
            if ($h -ne 0) {
              # 强制把窗口拉到 1600x1000：CI 虚拟屏只有 1024x768 会把窗口裁掉，
              # 而 PrintWindow 按窗口自身尺寸渲染，可验证「窗口变大后内容是否跟着铺开」
              [W.U]::SetWindowPos($h, [IntPtr]::Zero, 0, 0, 1600, 1000, 0x0014) | Out-Null
              Start-Sleep -Seconds 3
              $r = New-Object W.U+RECT
              [W.U]::GetWindowRect($h, [ref]$r) | Out-Null
              $w = $r.Right - $r.Left; $ht = $r.Bottom - $r.Top
              Write-Host "窗口尺寸 = ${w}x${ht}"
              if ($w -gt 100 -and $ht -gt 100) {
                $bmp = New-Object System.Drawing.Bitmap $w, $ht
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $hdc = $g.GetHdc()
                [W.U]::PrintWindow($h, $hdc, 2) | Out-Null
                $g.ReleaseHdc($hdc); $g.Dispose()
                $bmp.Save((Join-Path $PWD "ui-shot\ui.png"), [System.Drawing.Imaging.ImageFormat]::Png)
                $bmp.Dispose()
                Write-Host "UI 截图已保存: ui-shot\ui.png"
              }
            }
          } catch { Write-Host "UI 截图失败: $($_.Exception.Message)" }

          if (Test-Path $log) { Write-Host "----- 冒烟结束后的 app.log -----"; Get-Content $log }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "SMOKE_OK"

      # ---------- 4) 端到端真机测试：自动登录 + 通过本地接口真实对话 ----------
      - name: E2E (login + real chat completion)
        if: env.E2E_ENABLED == 'true' 
        continue-on-error: true
        shell: pwsh
        env:
          DS_E2E_PHONE: ${{ secrets.DS_TEST_PHONE }}
          DS_E2E_PASSWORD: ${{ secrets.DS_TEST_PASSWORD }}
        run: |
          $exe = Join-Path $PWD "publish\DeepSeekWebAPI.exe"
          $log = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI\app.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          Write-Host "启动端到端测试（凭据走环境变量，不打印）"
          $p = Start-Process -FilePath $exe -ArgumentList '--e2e' -PassThru
          if (-not $p.WaitForExit(900000)) { Write-Host "!! 超时"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "e2e exit = $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log }
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI"
          Copy-Item "$dir\*.log" e2e-out -ErrorAction SilentlyContinue
          Copy-Item "$dir\*.png" e2e-out -ErrorAction SilentlyContinue
          if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'E2E_OK')) { Write-Host "E2E_RESULT=OK" } else { Write-Host "E2E_RESULT=FAIL" }
          $raw = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($raw -match 'TOOLS_OK') { Write-Host "TOOLS_RESULT=OK" } elseif ($raw -match 'TOOLS_FAIL') { Write-Host "TOOLS_RESULT=FAIL" } else { Write-Host "TOOLS_RESULT=SKIP" }

      - name: E2E rotate (multi-account round-robin)
        if: env.E2E_ENABLED == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          DS_TEST_ACCOUNTS: ${{ secrets.DS_TEST_ACCOUNTS }}
        run: |
          $exe = Join-Path $PWD "publish\DeepSeekWebAPI.exe"
          $log = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI\app.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          Write-Host "启动多账号轮换测试（3 个账号，凭据走环境变量）"
          $p = Start-Process -FilePath $exe -ArgumentList @('--e2e-rotate','12') -PassThru
          if (-not $p.WaitForExit(1500000)) { Write-Host "!! 超时"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "rotate exit = $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log }
          $dir = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI"
          Copy-Item "$dir\*.log" e2e-out -ErrorAction SilentlyContinue
          if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'ROTATE_OK')) { Write-Host "ROTATE_RESULT=OK" } else { Write-Host "ROTATE_RESULT=FAIL" }

      - name: Device isolation probe (multi-instance device_id)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\DeepSeekWebAPI.exe"
          $log = Join-Path $env:LOCALAPPDATA "DeepSeekWebAPI\app.log"
          New-Item -ItemType Directory -Force probe-out | Out-Null
          $modes = @(
            @{ tag = 'separate-udf'; args = @('--probe-device','3') },
            @{ tag = 'multi-profile'; args = @('--probe-device','3','--profiles') }
          )
          foreach ($m in $modes) {
            Write-Host "===== 设备指纹探针: $($m.tag) ($($m.args -join ' ')) ====="
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList $m.args -PassThru
            if (-not $p.WaitForExit(420000)) { Write-Host "!! 超时"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "probe exit = $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log; Copy-Item $log (Join-Path $PWD "probe-out\probe-$($m.tag).log") -Force }
          }

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            desktop/DSWebApi.Desktop/e2e-out/*
            desktop/DSWebApi.Desktop/ui-shot/*
            desktop/DSWebApi.Desktop/probe-out/*
          if-no-files-found: ignore

      # ---------- 5) 收集产物 ----------
      - name: Collect artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $name = "DeepSeekWebAPI-Desktop-$tag-win-x64"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "publish\DeepSeekWebAPI.exe" "out\$name.exe"
          Compress-Archive -Path "out\$name.exe" -DestinationPath "out\$name.zip" -Force
          Get-ChildItem out | Select-Object Name,Length | Format-Table -AutoSize
          echo "ART_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWebAPI-desktop
          path: desktop/DSWebApi.Desktop/out/*
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Web API (Windows) ${{ github.ref_name }}
          files: desktop/DSWebApi.Desktop/out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
