name: Build Desktop EXE

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run logic tests
        run: node test/logic-test.js

      - name: Build Windows EXE
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List outputs
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWebAPI-Desktop
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DeepSeek Web API Desktop ${{ github.ref_name }}
          files: desktop/dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
